spring:
  application:
    name: sistema-firma-electronica-ebg
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/firma_ebg}
    username: ${DB_USERNAME:firma_ebg}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_IN_LOCAL_ENVIRONMENT}
      access-token-minutes: ${JWT_ACCESS_MINUTES:15}
  storage:
    root: ${DOCUMENT_STORAGE_ROOT:./storage}
